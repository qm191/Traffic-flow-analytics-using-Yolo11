tracker_type: bytetrack     # Chọn thuật toán ByteTrack
track_high_thresh: 0.5      # Ngưỡng confidence cho lần liên kết đầu tiên
track_low_thresh: 0.1       # Ngưỡng confidence cho lần liên kết thứ hai (khi xe bị mờ/che khuất)
new_track_thresh: 0.6       # Ngưỡng để tạo một Track ID hoàn toàn mới
track_buffer: 60            # TĂNG LÊN 60: Số lượng frame tối đa để giữ ID khi xe bị mất dấu
match_thresh: 0.8           # Ngưỡng khoảng cách IOU để ghép cặp bounding box

# --- CÁC THÔNG SỐ BẮT BUỘC ĐỂ TRÁNH LỖI PHIÊN BẢN MỚI ---
fuse_score: True            # Bắt buộc: Kết hợp điểm confidence vào tính toán khoảng cách
gmc_method: sparseOptFlow   # Phương pháp bù trừ chuyển động toàn cục
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False